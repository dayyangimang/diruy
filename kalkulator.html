<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator | Cah Infor Ngoding</title>
    <style>
      :root {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --surface-alt: #f1f4f8;
        --line: #e2e8f0;
        --line-strong: #cbd5e1;
        --text: #0f172a;
        --text-muted: #64748b;
        --text-sub: #94a3b8;
        --accent: #6da695;
        --accent-light: #e8f3f0;
        --accent-glow: rgba(109, 166, 149, 0.14);
        --green: #6da695;
        --amber: #c4a574;
        --amber-light: #f7f2e9;
        --blue: #7aa8c9;
        --blue-light: #eaf2f7;
        --purple: #8ca4b8;
        --purple-light: #edf2f6;
        --card-radius: 24px;
        --inner-radius: 16px;
        --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px -4px rgba(15,23,42,0.06);
        --shadow-lg: 0 20px 40px -12px rgba(15,23,42,0.12);
      }
      [data-theme="dark"] {
        --bg: #090a0f;
        --surface: #11131a;
        --surface-alt: #161922;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.16);
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --text-sub: #64748b;
        --accent: #7fb9aa;
        --accent-light: rgba(127, 185, 170, 0.13);
        --accent-glow: rgba(127, 185, 170, 0.2);
        --green: #7fb9aa;
        --amber: #cbb48d;
        --amber-light: rgba(203, 180, 141, 0.13);
        --blue: #8db3cb;
        --blue-light: rgba(141, 179, 203, 0.13);
        --purple: #9eb3c4;
        --purple-light: rgba(158, 179, 196, 0.13);
        --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 8px 30px -4px rgba(0,0,0,0.6);
        --shadow-lg: 0 24px 48px -12px rgba(0,0,0,0.8);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--text); font-family: "DM Sans", sans-serif; background: var(--bg); background-image: radial-gradient(at 100% 0%, #202734 0px, transparent 50%), radial-gradient(at 0% 100%, #202734 0px, transparent 50%); background-attachment: fixed; transition: background-color .25s ease, color .25s ease; }
      [data-theme="dark"] body { background-image: radial-gradient(at 100% 0%, #202734 0px, transparent 50%), radial-gradient(at 0% 100%, #202734 0px, transparent 50%); }
      .shell { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .back { color: var(--accent); font-weight: 700; text-decoration: none; }
      .back:hover { color: var(--text); }
      .top-menu { display: flex; align-items: center; gap: 16px; }
      .theme { padding: 8px 11px; border: 1px solid var(--line); border-radius: 3px; color: var(--text-muted); background: var(--surface-alt); font: inherit; font-size: .8rem; cursor: pointer; }
      .theme:hover { color: var(--accent); border-color: var(--accent); }
      .top-divider { width: 1px; height: 24px; background: var(--line); }
      .clock { color: var(--accent); font-family: "Times New Roman", Times, serif; font-size: 1rem; font-variant-numeric: tabular-nums; font-weight: 700; }
      .intro { margin-bottom: 28px; }
      .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1, h2 { font-family: "Space Grotesk", sans-serif; }
      h1 { margin: 10px 0 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: .95; letter-spacing: -.04em; }
      .layout { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(220px, .65fr); gap: 18px; align-items: start; }
      .calculator, .history { padding: 18px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
      .calculator-tools { display: flex; justify-content: flex-end; margin-bottom: 10px; }
      .format-toggle { padding: 6px 9px; border: 1px solid var(--line); border-radius: 3px; color: var(--text-muted); background: var(--surface); font: inherit; font-size: .76rem; cursor: pointer; }
      .format-toggle:hover, .format-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
      .screen { min-height: 118px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 6px; padding: 18px; margin-bottom: 14px; overflow: hidden; border-radius: 3px; background: var(--surface-alt); }
      .expression { width: 100%; overflow: hidden; color: var(--text-muted); font-size: .9rem; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
      .result { width: 100%; overflow: hidden; font-family: "Times New Roman", Times, serif; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
      .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
      .key { min-height: 52px; border: 1px solid var(--line); border-radius: 3px; color: var(--text); background: var(--surface); font: inherit; font-size: 1.05rem; cursor: pointer; }
      .key-spacer { min-height: 52px; }
      .key:hover { border-color: var(--accent); color: var(--accent); }
      .key.operator { color: var(--accent); font-weight: 700; }
      .key.action { color: var(--amber); }
      .key.equals { color: white; background: var(--accent); border-color: var(--accent); font-weight: 700; }
      .history h2 { margin: 0 0 14px; font-size: 1.25rem; }
      .history-list { display: grid; gap: 9px; max-height: 330px; overflow-y: auto; }
      .history-item { padding: 10px; border: 1px solid var(--line); border-radius: 3px; }
      .history-item span { display: block; color: var(--text-muted); font-size: .75rem; }
      .history-item strong { display: block; margin-top: 3px; font-family: "Times New Roman", Times, serif; font-size: 1rem; }
      .empty { color: var(--text-muted); font-size: .85rem; line-height: 1.5; }
      .clear-history { margin-top: 14px; padding: 0; border: 0; color: var(--amber); background: none; font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; }
      @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .history-list { max-height: none; } header { margin-bottom: 24px; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header><a class="back" href="index.html">← studispace bento</a><div class="top-menu"><button class="theme" id="themeToggle" type="button"></button><span class="top-divider" aria-hidden="true"></span><span class="clock" id="currentTime" aria-label="Waktu sekarang"></span></div></header>
      <section class="intro"><div class="eyebrow">Alat bantu hitung</div><h1>Kalkulator</h1></section>
      <section class="layout">
        <section class="calculator" aria-label="Kalkulator">
          <div class="calculator-tools"><button class="format-toggle" id="formatToggle" type="button" aria-pressed="true">Pemisah ribuan: Aktif</button></div>
          <div class="screen" aria-live="polite"><div class="expression" id="expression">&nbsp;</div><div class="result" id="result">0</div></div>
          <div class="keys">
            <button class="key action" data-action="clear">AC</button><button class="key action" data-action="backspace">⌫</button><button class="key operator" data-value="%">%</button><button class="key operator" data-value="/">÷</button>
            <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="*">×</button>
            <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="-">−</button>
            <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
            <span class="key-spacer" aria-hidden="true"></span><button class="key" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equals" data-action="equals">=</button>
          </div>
        </section>
        <aside class="history"><h2>Riwayat</h2><div class="history-list" id="historyList"></div><button class="clear-history" id="clearHistory" type="button">Hapus riwayat</button></aside>
      </section>
    </main>
    <script>
      const result = document.querySelector('#result');
      const expression = document.querySelector('#expression');
      const historyList = document.querySelector('#historyList');
      const currentTime = document.querySelector('#currentTime');
      let current = '0';
      let formula = '';
      let history = JSON.parse(localStorage.getItem('ruang-kuliah-calculator-history') || '[]');
      let thousandSeparator = localStorage.getItem('ruang-kuliah-calculator-thousand-separator') !== 'off';
      const savedTheme = localStorage.getItem('ruang-kuliah-theme') || 'light';
      updateClock();
      setInterval(updateClock, 1000);
      setTheme(savedTheme);

      document.querySelector('#themeToggle').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
      document.querySelector('#formatToggle').addEventListener('click', () => {
        thousandSeparator = !thousandSeparator;
        localStorage.setItem('ruang-kuliah-calculator-thousand-separator', thousandSeparator ? 'on' : 'off');
        document.querySelector('#formatToggle').setAttribute('aria-pressed', thousandSeparator);
        document.querySelector('#formatToggle').textContent = `Pemisah ribuan: ${thousandSeparator ? 'Aktif' : 'Nonaktif'}`;
        updateDisplay();
      });
      document.querySelector('#clearHistory').addEventListener('click', () => { history = []; localStorage.removeItem('ruang-kuliah-calculator-history'); renderHistory(); });
      document.querySelectorAll('.key').forEach(button => {
        button.addEventListener('click', () => {
          const value = button.dataset.value;
          const action = button.dataset.action;
          if (value !== undefined) handleValue(value);
          if (action === 'clear') handleClear();
          if (action === 'backspace') handleBackspace();
          if (action === 'equals') handleEquals();
        });
      });
      document.addEventListener('keydown', event => {
        if ((event.key >= '0' && event.key <= '9') || event.key === '.') handleValue(event.key);
        if (['+', '-', '*', '/'].includes(event.key)) handleValue(event.key);
        if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); handleEquals(); }
        if (event.key === 'Backspace') handleBackspace();
        if (event.key === 'Escape') handleClear();
      });

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem('ruang-kuliah-theme', theme);
        const dark = theme === 'dark';
        document.querySelector('#themeToggle').textContent = dark ? '☀ Light' : '☾ Dark';
      }
      function updateClock() {
        const now = new Date();
        currentTime.textContent = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
      }
      function formatNumber(value) {
        if (!thousandSeparator) return value;
        const parts = String(value).split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return parts.join(',');
      }
      function updateDisplay() {
        result.textContent = formatNumber(current);
        expression.textContent = formula || '\xa0';
      }
      function handleValue(val) {
        const opMap = { '*': '×', '/': '÷', '-': '−' };
        if (['+', '*', '/', '-'].includes(val)) {
          formula += ` ${current} ${opMap[val] || val} `;
          current = '0';
        } else if (val === '%') {
          current = String(Number(current) / 100);
        } else {
          if (current === '0' && val !== '.') current = val;
          else current += val;
        }
        updateDisplay();
      }
      function handleClear() { current = '0'; formula = ''; updateDisplay(); }
      function handleBackspace() {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        updateDisplay();
      }
      function handleEquals() {
        try {
          const fullExpr = formula + current;
          const sanitized = fullExpr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\./g, '').replace(/,/g, '.');
          const res = String(Number(Function(`return ${sanitized}`)().toFixed(6)));
          history.unshift({ expr: fullExpr, result: res });
          if (history.length > 20) history.pop();
          localStorage.setItem('ruang-kuliah-calculator-history', JSON.stringify(history));
          formula = '';
          current = res;
          renderHistory();
          updateDisplay();
        } catch {
          result.textContent = 'Error';
        }
      }
      function renderHistory() {
        if (!history.length) { historyList.innerHTML = '<div class="empty">Belum ada riwayat hitung.</div>'; return; }
        historyList.innerHTML = history.map(item => `<div class="history-item"><span>${escapeHtml(item.expr)}</span><strong>= ${escapeHtml(item.result)}</strong></div>`).join('');
      }
      function escapeHtml(val) {
        return String(val).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]);
      }
      renderHistory();
      updateDisplay();
    </script>
  </body>
</html>
