<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator | Cah Infor Ngoding</title>
    <style>
      :root {
        --ink: #17231d;
        --muted: #68766d;
        --paper: #f5f5ef;
        --line: #dce2d9;
        --cream: #fcfcf8;
        --green: #216b4a;
        --coral: #e77a5c;
        --display: #e7eee3;
        --button: #ffffff;
      }
      [data-theme="dark"] {
        --ink: #edf3ed;
        --muted: #aab8ad;
        --paper: #040d12;
        --line: #35463b;
        --cream: #222831;
        --green: #77c99a;
        --coral: #e99a7e;
        --display: #182b2d;
        --button: #1c2d2d;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "DM Sans", sans-serif; background: var(--paper); background-image: radial-gradient(#d8dfd3 0.7px, transparent 0.7px); background-size: 18px 18px; }
      [data-theme="dark"] body { background-image: radial-gradient(#10252d 0.7px, transparent 0.7px); }
      .shell { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .back { color: var(--green); font-weight: 700; text-decoration: none; }
      .back:hover { color: var(--ink); }
      .top-menu { display: flex; align-items: center; gap: 16px; }
      .theme { padding: 8px 11px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: var(--cream); font: inherit; font-size: .8rem; cursor: pointer; }
      .theme:hover { color: var(--green); border-color: var(--green); }
      .top-divider { width: 1px; height: 24px; background: var(--line); }
      .clock { color: var(--green); font-family: "Times New Roman", Times, serif; font-size: 1rem; font-variant-numeric: tabular-nums; font-weight: 700; }
      .intro { margin-bottom: 28px; }
      .eyebrow { color: var(--green); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1, h2 { font-family: "Space Grotesk", sans-serif; }
      h1 { margin: 10px 0 0; font-size: clamp(2rem, 5vw, 3.5rem); line-height: .95; letter-spacing: -.04em; }
      .layout { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(220px, .65fr); gap: 18px; align-items: start; }
      .calculator, .history { padding: 18px; border: 1px solid var(--line); border-radius: 5px; background: var(--cream); }
      .calculator-tools { display: flex; justify-content: flex-end; margin-bottom: 10px; }
      .format-toggle { padding: 6px 9px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: var(--button); font: inherit; font-size: .76rem; cursor: pointer; }
      .format-toggle:hover, .format-toggle[aria-pressed="true"] { color: var(--green); border-color: var(--green); }
      .screen { min-height: 118px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 6px; padding: 18px; margin-bottom: 14px; overflow: hidden; border-radius: 3px; background: var(--display); }
      .expression { width: 100%; overflow: hidden; color: var(--muted); font-size: .9rem; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
      .result { width: 100%; overflow: hidden; font-family: "Times New Roman", Times, serif; font-size: clamp(2rem, 7vw, 3.6rem); line-height: 1; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
      .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
      .key { min-height: 52px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: var(--button); font: inherit; font-size: 1.05rem; cursor: pointer; }
			.key-spacer { min-height: 52px; }
      .key:hover { border-color: var(--green); color: var(--green); }
      .key.operator { color: var(--green); font-weight: 700; }
      .key.action { color: var(--coral); }
      .key.equals { color: white; background: var(--green); border-color: var(--green); font-weight: 700; }
      .history h2 { margin: 0 0 14px; font-size: 1.25rem; }
      .history-list { display: grid; gap: 9px; max-height: 330px; overflow-y: auto; }
      .history-item { padding: 10px; border: 1px solid var(--line); border-radius: 3px; }
      .history-item span { display: block; color: var(--muted); font-size: .75rem; }
      .history-item strong { display: block; margin-top: 3px; font-family: "Times New Roman", Times, serif; font-size: 1rem; }
      .empty { color: var(--muted); font-size: .85rem; line-height: 1.5; }
      .clear-history { margin-top: 14px; padding: 0; border: 0; color: var(--coral); background: none; font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; }
      @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .history-list { max-height: none; } header { margin-bottom: 24px; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header><a class="back" href="index.html">← Cah Infor Ngoding</a><div class="top-menu"><button class="theme" id="themeToggle" type="button"></button><span class="top-divider" aria-hidden="true"></span><span class="clock" id="currentTime" aria-label="Waktu sekarang"></span></div></header>
      <section class="intro"><div class="eyebrow">Alat bantu hitung</div><h1>Kalkulator</h1></section>
      <section class="layout">
        <section class="calculator" aria-label="Kalkulator">
          <div class="calculator-tools"><button class="format-toggle" id="formatToggle" type="button" aria-pressed="true">Pemisah ribuan: Aktif</button></div>
          <div class="screen" aria-live="polite"><div class="expression" id="expression">&nbsp;</div><div class="result" id="result">0</div></div>
          <div class="keys">
            <button class="key action" data-action="clear">AC</button><button class="key action" data-action="backspace">⌫</button><button class="key operator" data-value="%">%</button><button class="key operator" data-value="/">÷</button>
            <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="*">×</button>
            <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="-">−</button>
            <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
            <span class="key-spacer" aria-hidden="true"></span><button class="key" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equals" data-action="equals">=</button>
          </div>
        </section>
        <aside class="history"><h2>Riwayat</h2><div class="history-list" id="historyList"></div><button class="clear-history" id="clearHistory" type="button">Hapus riwayat</button></aside>
      </section>
    </main>
    <script>
      const result = document.querySelector('#result');
      const expression = document.querySelector('#expression');
      const historyList = document.querySelector('#historyList');
      const currentTime = document.querySelector('#currentTime');
      let current = '0';
      let formula = '';
      let history = JSON.parse(localStorage.getItem('ruang-kuliah-calculator-history') || '[]');
      let thousandSeparator = localStorage.getItem('ruang-kuliah-calculator-thousand-separator') !== 'off';
      const savedTheme = localStorage.getItem('ruang-kuliah-theme') || 'light';
      updateClock();
      setInterval(updateClock, 1000);
      setTheme(savedTheme);
      render();
      document.querySelector('.keys').addEventListener('click', event => {
        const key = event.target.closest('.key');
        if (!key) return;
        if (key.dataset.value) input(key.dataset.value);
        if (key.dataset.action === 'clear') clear();
        if (key.dataset.action === 'backspace') backspace();
        if (key.dataset.action === 'equals') calculate();
      });
      document.addEventListener('keydown', event => {
        if (/^[0-9+\-*/%.]$/.test(event.key)) input(event.key);
        if (event.key === 'Enter' || event.key === '=') calculate();
        if (event.key === 'Escape') clear();
        if (event.key === 'Backspace') backspace();
      });
      document.querySelector('#clearHistory').addEventListener('click', () => { history = []; saveHistory(); render(); });
      document.querySelector('#themeToggle').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
      document.querySelector('#formatToggle').addEventListener('click', () => { thousandSeparator = !thousandSeparator; localStorage.setItem('ruang-kuliah-calculator-thousand-separator', thousandSeparator ? 'on' : 'off'); render(); });
      function input(value) { if (current === 'Error') clear(); if (value === '.' && current.includes('.')) return; if (/\d/.test(value) && current === '0') current = value; else current += value; formula += value; render(); }
      function clear() { current = '0'; formula = ''; render(); }
      function backspace() { current = current.length > 1 ? current.slice(0, -1) : '0'; formula = formula.slice(0, -1); render(); }
      function calculate() {
        if (!formula || !/[0-9]$/.test(formula)) return;
        try {
          const safeFormula = formula.replace(/%/g, '/100');
          if (!/^[0-9+\-*/%.() ]+$/.test(safeFormula)) throw new Error();
          const value = Function(`"use strict"; return (${safeFormula})`)();
          if (!Number.isFinite(value)) throw new Error();
          const answer = String(Number(value.toFixed(10)));
          history.unshift({ formula, answer }); history = history.slice(0, 20); saveHistory(); expression.textContent = formatFormula(formula); current = answer; formula = answer; render();
        } catch { expression.textContent = 'Perhitungan tidak valid'; current = 'Error'; formula = ''; render(); }
      }
      function render() {
        // `current` juga menyimpan operasi yang sedang diketik, jadi format setiap angka di dalamnya.
        result.textContent = formatFormula(current);
        if (expression.textContent !== 'Perhitungan tidak valid') expression.textContent = formatFormula(formula) || '\u00a0';
        historyList.innerHTML = history.length ? history.map(item => `<div class="history-item"><span>${escapeHtml(formatFormula(item.formula))}</span><strong>= ${escapeHtml(formatNumber(item.answer))}</strong></div>`).join('') : '<div class="empty">Belum ada perhitungan.</div>';
        const formatToggle = document.querySelector('#formatToggle');
        formatToggle.textContent = 'Pemisah ribuan: ' + (thousandSeparator ? 'Aktif' : 'Nonaktif');
        formatToggle.setAttribute('aria-pressed', String(thousandSeparator));
      }
      function formatNumber(value) {
        if (!thousandSeparator || value === 'Error' || value === '') return value;
        const number = Number(value);
        return Number.isFinite(number) ? new Intl.NumberFormat('id-ID', { maximumFractionDigits: 10 }).format(number) : value;
      }
      function formatFormula(value) { return thousandSeparator ? value.replace(/(?:\d+\.?\d*|\.\d+)/g, formatNumber) : value; }
      function saveHistory() { localStorage.setItem('ruang-kuliah-calculator-history', JSON.stringify(history)); }
      function setTheme(theme) { document.documentElement.dataset.theme = theme; localStorage.setItem('ruang-kuliah-theme', theme); document.querySelector('#themeToggle').textContent = theme === 'dark' ? '☀ Light' : '☾ Dark'; }
      function updateClock() { const now = new Date(); currentTime.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`; }
      function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]); }
    </script>
  </body>
</html>
